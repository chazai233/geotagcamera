# One build per CPU type. versionCode = 10 * defaultConfig.versionCode + ABI digit
# (1 armeabi-v7a, 2 arm64-v8a, 3 x86_64), computed by app/build.gradle.kts.
# Builds are reproducible (checked by .github/workflows/reproducible.yml), so each
# build is verified against the signed GitHub release APK via binary:, and F-Droid
# ships the upstream-signed APK.
Builds:
  - versionName: 1.4.1
    versionCode: 71
    commit: 8bbf6a893b88fca140009d0f6244b9df5c93aecd
    subdir: app
    gradle:
      - foss
    gradleprops:
      - abi=armeabi-v7a
    output: build/outputs/apk/foss/release/app-foss-armeabi-v7a-release-unsigned.apk
    binary: https://github.com/konkomaji/geotagcamera/releases/download/v%v/geotagcamera-v%v-armeabi-v7a.apk

  - versionName: 1.4.1
