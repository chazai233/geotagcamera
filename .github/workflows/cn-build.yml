name: CN Build

# 工程水印相机（中文版）的构建与发布。
#
# - 推送到 main：跑单元测试，编译用正式密钥签名的 APK，更新"测试版"（标签 cn-latest，会被覆盖）。
#   如果当前 versionName 还没有发布过（不存在标签 v版本号），同时发布正式版：自动打上固定标签 v版本号，永久保留。
# - 也可以手动推送标签 v*-cn* 发布正式版。
#
# 签名密钥只从仓库的 Actions Secrets 读取，仓库里不存放任何密钥：
#   KEYSTORE_BASE64   正式密钥库文件（.jks）的 Base64
#   KEYSTORE_PASSWORD 密钥库密码
#   KEY_ALIAS         密钥别名
#   KEY_PASSWORD      密钥密码
# 没配置这些 Secrets 时只跑测试，不发布任何 APK。
on:
  push:
    branches: [main]
    tags: ["v*-cn*"]
    paths-ignore:
      - "site/**"
      - "README*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Read version
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "versionName: $VERSION"
          # 这个版本还没发布过 → 本次同时发布正式版
          if [ "$IS_TAG" = "true" ] || ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
            echo "本次发布正式版 v$VERSION"
          else
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          if [ "$IS_TAG" = "true" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 app/build.gradle.kts 里的 versionName \"$VERSION\" 不一致"
            exit 1
          fi

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew testFossReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 没有密钥时也编译一次（未签名），提前发现混淆等发布构建的问题
      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleFossRelease --no-daemon --stacktrace 2>&1 | tee -a build.log
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::发布构建编译通过，但没有配置签名密钥（Settings → Secrets and variables → Actions），不发布 APK。"
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/foss/release/*universal*.apk | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没有生成已签名的 APK"
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          "$apksigner" verify --print-certs "$APK" | tee cert.txt
          mkdir -p dist
          mkdir -p dist-release
          cp "$APK" dist/GongChengCamera.apk
          (cd dist && sha256sum GongChengCamera.apk > GongChengCamera.apk.sha256)
          cp "$APK" "dist-release/GongChengCamera-${VERSION}.apk"
          (cd dist-release && sha256sum "GongChengCamera-${VERSION}.apk" > "GongChengCamera-${VERSION}.apk.sha256")

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # 失败时把日志推到 ci-logs 分支，不登录 Actions 也能查看
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/cilogs
          cp build.log /tmp/cilogs/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/cilogs/ \; 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/cilogs/SHA
          git config user.name "cn-build"
          git config user.email "cn-build@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/cilogs/* .
          git add -A
          git commit -qm "build logs ${GITHUB_SHA}"
          git push -f origin ci-logs

      - name: Release notes
        if: success()
        run: |
          # 正式版取 CHANGELOG_CN.md 中对应版本的一节；测试版取最上面一节
          if [ "$IS_RELEASE" = "true" ]; then
            awk -v ver="$VERSION" '/^## /{ if (found) exit; if (index($0, "## " ver) == 1) { found = 1 } } found' CHANGELOG_CN.md > notes.md
          else
            {
              echo "> 测试版：每次推送自动更新，内容可能还在调整。需要固定版本请到 Releases 页下载带版本号的正式版。"
              echo
              awk '/^## /{n++} n==1' CHANGELOG_CN.md
            } > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG_CN.md 中没有 $VERSION 的说明。" > notes.md
          fi
          {
            echo
            echo "---"
            echo "### 安装"
            echo "在手机上下载下方的 APK 安装。同一签名的新版本可以直接覆盖安装，设置和照片都会保留。"
            echo "包名带 .cn 后缀，可与原版 GeoTag Camera 同时安装。需要 Android 8.0 及以上。"
            echo
            echo "### 对应源码"
            echo "提交 [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA})。本应用以 GPL-3.0-or-later 发布，基于 [GeoTag Camera](https://github.com/konkomaji/geotagcamera)（作者 Konko Maji）修改。"
            echo
            echo "### 签名证书"
            echo '```'
            grep -E 'SHA-256 digest' cert.txt | head -1
            echo '```'
          } >> notes.md
          # 正式版和测试版文件名不同，各自附上自己的 SHA-256
          cp notes.md notes-release.md
          { echo "### 文件校验 SHA-256"; echo '```'; cat dist/*.sha256; echo '```'; } >> notes.md
          { echo "### 文件校验 SHA-256"; echo '```'; cat dist-release/*.sha256; echo '```'; } >> notes-release.md
          cat notes.md

      - name: Publish test build
        if: success() && env.IS_TAG != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cn-latest --cleanup-tag -y 2>/dev/null || true
          gh release create cn-latest dist/* \
            --target "${GITHUB_SHA}" \
            --title "工程水印相机 测试版（${VERSION}）" \
            --notes-file notes.md \
            --prerelease

      - name: Publish release
        if: success() && env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* \
              --target "${GITHUB_SHA}" \
              --title "工程水印相机 ${VERSION}" \
              --notes-file notes-release.md \
              --latest
          fi
