name: CN Build

# 中文版：每次推送到 main 自动编译 APK，并发布到 Releases 的 "cn-latest"。
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "README*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew testFossDebugUnitTest assembleFossDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 编译失败时，把日志推到 ci-logs 分支，方便不登录 Actions 也能查看。
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/cilogs
          cp build.log /tmp/cilogs/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/cilogs/ \; 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/cilogs/SHA
          git config user.name "cn-build"
          git config user.email "cn-build@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/cilogs/* .
          git add -A
          git commit -qm "build logs ${GITHUB_SHA}"
          git push -f origin ci-logs

      - name: Publish APK to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*universal*.apk | head -1)
          cp "$APK" GongChengCamera.apk
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          # 发行说明 = CHANGELOG_CN.md 最上面一节 + 安装说明 + 本次构建信息
          awk '/^## /{n++} n==1' CHANGELOG_CN.md > notes.md
          {
            echo
            echo "---"
            echo "### 安装"
            echo "在手机上下载下方的 **GongChengCamera.apk** 直接安装；已安装旧版的直接覆盖安装，设置和照片都会保留。"
            echo "包名带 .cn 后缀，可与原版 GeoTag Camera 同时安装。需要 Android 8.0 及以上。"
            echo
            echo "### 本次构建"
            echo "提交 ${GITHUB_SHA::7}，构建时间 $(TZ=Asia/Vientiane date '+%Y-%m-%d %H:%M')（UTC+7）。最近的改动："
            echo
            git log -8 --no-merges --pretty='- %s (%h)' | grep -v '^- 测试'
          } >> notes.md
          gh release delete cn-latest --cleanup-tag -y 2>/dev/null || true
          gh release create cn-latest GongChengCamera.apk \
            --target "${GITHUB_SHA}" \
            --title "工程水印相机 ${VERSION}" \
            --notes-file notes.md
