name: CN Build

# 中文版：每次推送到 main 自动编译 APK，并发布到 Releases 的 "cn-latest"。
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew testFossDebugUnitTest assembleFossDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 编译失败时，把日志推到 ci-logs 分支，方便不登录 Actions 也能查看。
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/cilogs
          cp build.log /tmp/cilogs/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/cilogs/ \; 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/cilogs/SHA
          git config user.name "cn-build"
          git config user.email "cn-build@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/cilogs/* .
          git add -A
          git commit -qm "build logs ${GITHUB_SHA}"
          git push -f origin ci-logs

      - name: Publish APK to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*universal*.apk | head -1)
          cp "$APK" GongChengCamera.apk
          gh release delete cn-latest --cleanup-tag -y 2>/dev/null || true
          gh release create cn-latest GongChengCamera.apk \
            --target "${GITHUB_SHA}" \
            --title "工程水印相机 最新构建" \
            --notes "自动构建，提交 ${GITHUB_SHA::7}。手机上下载 GongChengCamera.apk 直接安装即可。"
