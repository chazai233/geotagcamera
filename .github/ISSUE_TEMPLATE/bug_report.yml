name: Bug report
description: Something in the app doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If it's a security problem (for example an edited photo that still verifies, or location data leaking), please use a [private security advisory](https://github.com/konkomaji/geotagcamera/security/advisories/new) instead.

        Please don't attach photos that show your exact location unless you're fine with that being public. EXIF data in an uploaded photo can include GPS coordinates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Turn on ...
        3. Take a photo
        4. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on the About & legal screen.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app?
      options:
        - GitHub Releases
        - Built it myself
        - Somewhere else
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 7, Android 14"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network at the time
      options:
        - Online
        - Offline / no signal
        - Not sure
  - type: checkboxes
    id: features
    attributes:
      label: Optional features turned on
      options:
        - label: Map thumbnail
        - label: Weather
        - label: Field-worker signature
        - label: Organization logo
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Logcat output, screenshots or a screen recording if you have them. Remove anything you don't want public.
      render: text
